steps:
  # Build and push backend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ai-academy-backend:latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ai-academy-backend:$SHORT_SHA'
      - './backend'

  # Build and push frontend image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ai-academy-frontend:latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/ai-academy-frontend:$SHORT_SHA'
      - './frontend'

  # Push images
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/ai-academy-backend:latest']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/ai-academy-frontend:latest']

  # Deploy backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'ai-academy-backend'
      - '--image=gcr.io/$PROJECT_ID/ai-academy-backend:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--set-env-vars=SECRET_KEY=${_SECRET_KEY},DATABASE_URL=sqlite:///./data/plataforma.db,SMTP_HOST=smtp.gmail.com,SMTP_PORT=587,SMTP_USER=${_SMTP_USER},SMTP_PASSWORD=${_SMTP_PASSWORD},FROM_EMAIL=${_FROM_EMAIL},FRONTEND_URL=${_FRONTEND_URL}'

  # Deploy frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'ai-academy-frontend'
      - '--image=gcr.io/$PROJECT_ID/ai-academy-frontend:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=80'

substitutions:
  _SECRET_KEY: supersecretkey
  _SMTP_USER: ''
  _SMTP_PASSWORD: ''
  _FROM_EMAIL: ''
  _FRONTEND_URL: 'https://ai-academy-frontend-xyz-uc.a.run.app'

timeout: 1200s
